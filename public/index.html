<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tkt-app</title>

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="header">
    <h1>tkt-app</h1>
    <p>シンプルなメッセージボード</p>
  </header>

  <main class="container">
    <section class="card">
      <input id="name" placeholder="名前（40文字まで）" />
      <textarea id="content" placeholder="内容（200文字まで）"></textarea>

      <div class="actions">
        <button id="sendBtn" class="primary">送信</button>
        <button id="reloadBtn">更新</button>
      </div>

      <p id="error" class="error"></p>
    </section>

    <section id="list" class="list"></section>
  </main>

  <footer class="footer">
    © 2025 tkt-app
  </footer>

  <script src="/javascript/app.js" defer></script>
</body>

</html>
