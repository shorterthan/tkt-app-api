<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tkt-app</title>

  <!-- ✅ CSS読み込み -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="container">
    <h1>tkt-app（メッセージ）</h1>

    <div class="card">
      <input id="name" placeholder="名前（40文字まで）" />
      <textarea id="content" placeholder="内容（200文字まで）"></textarea>

      <div class="buttons">
        <button id="sendBtn">送信</button>
        <button id="reloadBtn">更新</button>
      </div>

      <p id="error" class="error"></p>
    </div>

    <div id="list" class="list"></div>
  </div>

  <!-- ✅ JS読み込み（bodyの最後） -->
  <script src="javascript/app.js" defer></script>
</body>

</html>
